events {}

http {
    # Docker's embedded DNS server. Re-resolving lets Nginx notice scaled
    # replicas without requiring a restart.
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    upstream jatos_nodes {
        zone jatos_nodes 64k;
        least_conn;

        server jatos-seed:9000 resolve;
        server jatos:9000 resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://jatos_nodes;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Batch and group WebSockets can remain idle for long periods.
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;
        }
    }
}
