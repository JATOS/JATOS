# This is the base configuration file for the JATOS. It is packed in JATOS' jar.
# To config JATOS individually use jatos.conf.
# ~~~~~

# General config
# ~~~~~
play.i18n.langs = ["en", "en-US"]


# JATOS' configuration
# Each setting accepts an optional environment override shown below; defaults remain when it is absent.
# List-valued environment variables use JSON arrays, e.g. JATOS_MCP_ALLOWED_ORIGINS='["https://example.org"]'.
# LDAP BASEDN accepts either a single DN or a JSON array of DNs.
jatos {

  # Host address and port
  # Default are 0.0.0.0 and 9000
  http {
    address = "0.0.0.0"
    address = ${?play.server.http.address}
    address = ${?http.address}
    address = ${?JATOS_HTTP_ADDRESS}

    port = 9000
    port = ${?play.server.http.port}
    port = ${?http.port}
    port = ${?JATOS_HTTP_PORT}
  }

  # Secret needed for session cookie encryption. The GENERATED_SECRET is written by the loader.sh. The order of
  # precedence is: GENERATED_SECRET, JATOS_SECRET, jatos.secret, and play.http.secret.key (last one is highest).
  secret = ${?GENERATED_SECRET}
  secret = ${?JATOS_SECRET}

  # Add a base URL to the root of the application path (default is "/")
  urlBasePath = "/"
  urlBasePath = ${?JATOS_URL_BASE_PATH}

  # JATOS' study assets root directory path
  # Default is ./study_assets_root
  # Can be set by env variable JATOS_STUDY_ASSETS_ROOT_PATH or via command line args
  # Legacy setting retained as the fallback for studyAssets.rootPath.
  studyAssetsRootPath = "study_assets_root"
  studyAssetsRootPath = ${?JATOS_STUDY_ASSETS_ROOT_PATH}
  # Preferred setting; an explicit value takes precedence over the legacy setting.
  studyAssets.rootPath = ${jatos.studyAssetsRootPath}

  # Individual study asset uploads
  studyAssets.maxFileSize = 100MB
  studyAssets.maxFileSize = ${?JATOS_STUDY_ASSETS_MAX_FILE_SIZE}

  studyLogs.enabled = true
  studyLogs.enabled = ${?JATOS_STUDY_LOGS_ENABLED}
  # Path where JATOS stores its logs for each study
  # Default is ./study_logs
  # Can be set by env variable JATOS_STUDY_LOGS_PATH or via command line args
  studyLogs.path = "study_logs"
  studyLogs.path = ${?JATOS_STUDY_LOGS_PATH}

  resultUploads.enabled = true
  resultUploads.enabled = ${?JATOS_RESULT_UPLOADS_ENABLED}
  # Path where JATOS stores uploads from study runs
  # Default is ./result_uploads
  # Can be set by env variable JATOS_RESULT_UPLOADS_PATH or via command line args
  resultUploads.path = "result_uploads"
  resultUploads.path = ${?JATOS_RESULT_UPLOADS_PATH}
  # Max file size
  resultUploads.maxFileSize = 30MB
  resultUploads.maxFileSize = ${?JATOS_RESULT_UPLOADS_MAX_FILE_SIZE}
  # Limit of all files per study run
  resultUploads.limitPerStudyRun = 50MB
  resultUploads.limitPerStudyRun = ${?JATOS_RESULT_UPLOADS_LIMIT_PER_STUDY_RUN}

  # Max size of result data of one component result
  resultData.maxSize = 5MB
  resultData.maxSize = ${?JATOS_RESULT_DATA_MAX_SIZE}

  # Study archive uploads: exact file limit and raw-upload spill threshold
  studyArchive.maxSize = 2GB
  studyArchive.maxSize = ${?JATOS_STUDY_ARCHIVE_MAX_SIZE}
  studyArchive.maxMemoryBuffer = 1MB
  studyArchive.maxMemoryBuffer = ${?JATOS_STUDY_ARCHIVE_MAX_MEMORY_BUFFER}

  # General request limits; dedicated upload and result-data parsers override these
  http.parser.maxMemoryBuffer = 500kB
  http.parser.maxMemoryBuffer = ${?JATOS_HTTP_PARSER_MAX_MEMORY_BUFFER}
  http.parser.maxDiskBuffer = 10MB
  http.parser.maxDiskBuffer = ${?JATOS_HTTP_PARSER_MAX_DISK_BUFFER}

  # Maximal number of results to be fetched from the DB at once
  maxResultsDbQuerySize = 1000
  maxResultsDbQuerySize = ${?JATOS_MAX_RESULTS_DB_QUERY_SIZE}

  # User session configuration: timeout in minutes
  userSession.timeout = 1440
  userSession.timeout = ${?JATOS_USER_SESSION_TIMEOUT}
  # User session configuration: timeout after inactivity in minutes
  userSession.inactivity = 60
  userSession.inactivity = ${?JATOS_USER_SESSION_INACTIVITY}
  # If true, the user has the possibility (a checkbox on the GUI's signin page) to keep the user session and to not get
  # signed out automatically due to user a session timeout (neither through normal timeout nor inactivity). If set to true
  # and the user chooses to keep being signed in, the user session is kept until the user signs out manually or the
  # session cookie is deleted. Default is true.
  userSession.allowKeepSignedin = true
  userSession.allowKeepSignedin = ${?JATOS_USER_SESSION_ALLOW_KEEP_SIGNEDIN}

  # Password length restriction
  user.password.length = 7
  user.password.length = ${?JATOS_USER_PASSWORD_LENGTH}
  # Password strength: one of the following
  #   0: No restrictions on characters
  #   1: At least one Latin letter and one number
  #   2: At least one Latin letter, one number and one special character (#?!@$%^&*-)
  #   3: At least one uppercase Latin letter, one lowercase Latin letter, one number and one special character (#?!@$%^&*-)
  user.password.strength = 0
  user.password.strength = ${?JATOS_USER_PASSWORD_STRENGTH}

  user.authentication.ldap {
    # LDAP url (e.g. "ldap://ldap.forumsys.com:389")
    url = ""
    url = ${?JATOS_USER_AUTHENTICATION_LDAP_URL}
    # The name of the attribute used to identify the user, e.g 'uid' or 'cn'
    userAttribute = "uid"
    userAttribute = ${?JATOS_USER_AUTHENTICATION_LDAP_USER_ATTRIBUTE}
    # LDAP base DN(s) (distinguished name)
    # Can be one DN with a single string (e.g. "ou=students,dc=example,dc=com") or a list of DNs
    # (e.g. ["ou=students,dc=example,dc=com", "ou=scientists,dc=example,dc=com"])
    basedn = ""
    basedn = ${?JATOS_USER_AUTHENTICATION_LDAP_BASEDN}
    # DN (distinguished name) of an admin user that has the right to search LDAP for other users
    admin.dn = ""
    admin.dn = ${?JATOS_USER_AUTHENTICATION_LDAP_ADMIN_DN}
    # Password of the admin user
    admin.password = ""
    admin.password = ${?JATOS_USER_AUTHENTICATION_LDAP_ADMIN_PASSWORD}
    # Timout for waiting for response from LDAP server
    timeout = 5000
    timeout = ${?JATOS_USER_AUTHENTICATION_LDAP_TIMEOUT}
  }

  # Google OAuth client ID (https://developers.google.com/identity/sign-in/web/sign-in)
  user.authentication.oauth.googleClientId = ""
  user.authentication.oauth.googleClientId = ${?JATOS_USER_AUTHENTICATION_OAUTH_GOOGLE_CLIENT_ID}

  # OpenID Connect (OIDC) authentication
  user.authentication.oidc {
    discoveryUrl = ""
    discoveryUrl = ${?JATOS_USER_AUTHENTICATION_OIDC_DISCOVERY_URL}
    clientId = ""
    clientId = ${?JATOS_USER_AUTHENTICATION_OIDC_CLIENT_ID}
    clientSecret = ""
    clientSecret = ${?JATOS_USER_AUTHENTICATION_OIDC_CLIENT_SECRET}
    scope = ["openid"]
    scope = ${?JATOS_USER_AUTHENTICATION_OIDC_SCOPE}
    pkceMode = "off"
    pkceMode = ${?JATOS_USER_AUTHENTICATION_OIDC_PKCE_MODE}
    usernameFrom = "subject"
    usernameFrom = ${?JATOS_USER_AUTHENTICATION_OIDC_USERNAME_FROM}
    idTokenSigningAlgorithm = "RS256"
    idTokenSigningAlgorithm = ${?JATOS_USER_AUTHENTICATION_OIDC_ID_TOKEN_SIGNING_ALGORITHM}
    signInButtonText = "Sign in with OIDC"
    signInButtonText = ${?JATOS_USER_AUTHENTICATION_OIDC_SIGN_IN_BUTTON_TEXT}
    signInButtonLogoUrl = "assets/lib/jatos-gui/images/OpenID_logo.svg"
    signInButtonLogoUrl = ${?JATOS_USER_AUTHENTICATION_OIDC_SIGN_IN_BUTTON_LOGO_URL}
    successFeedback = ""
    successFeedback = ${?JATOS_USER_AUTHENTICATION_OIDC_SUCCESS_FEEDBACK}
  }

  # ORCID (orcid.org) authentication
  user.authentication.orcid {
    discoveryUrl = "https://orcid.org/.well-known/openid-configuration"
    discoveryUrl = ${?JATOS_USER_AUTHENTICATION_ORCID_DISCOVERY_URL}
    clientId = ""
    clientId = ${?JATOS_USER_AUTHENTICATION_ORCID_CLIENT_ID}
    clientSecret = ""
    clientSecret = ${?JATOS_USER_AUTHENTICATION_ORCID_CLIENT_SECRET}
    scope = ["openid"]
    scope = ${?JATOS_USER_AUTHENTICATION_ORCID_SCOPE}
    pkceMode = "off"
    pkceMode = ${?JATOS_USER_AUTHENTICATION_ORCID_PKCE_MODE}
    usernameFrom = "subject"
    usernameFrom = ${?JATOS_USER_AUTHENTICATION_ORCID_USERNAME_FROM}
    idTokenSigningAlgorithm = "RS256"
    idTokenSigningAlgorithm = ${?JATOS_USER_AUTHENTICATION_ORCID_ID_TOKEN_SIGNING_ALGORITHM}
    signInButtonText = "Sign in with ORCID"
    signInButtonText = ${?JATOS_USER_AUTHENTICATION_ORCID_SIGN_IN_BUTTON_TEXT}
    signInButtonLogoUrl = "assets/lib/jatos-gui/images/ORCIDiD_iconvector.svg"
    signInButtonLogoUrl = ${?JATOS_USER_AUTHENTICATION_ORCID_SIGN_IN_BUTTON_LOGO_URL}
    successFeedback = "You successfully connected your ORCID ID to JATOS."
    successFeedback = ${?JATOS_USER_AUTHENTICATION_ORCID_SUCCESS_FEEDBACK}
  }

  # SURF SRAM (sram.surf.nl) authentication
  user.authentication.sram {
    discoveryUrl = "https://proxy.sram.surf.nl/.well-known/openid-configuration"
    discoveryUrl = ${?JATOS_USER_AUTHENTICATION_SRAM_DISCOVERY_URL}
    clientId = ""
    clientId = ${?JATOS_USER_AUTHENTICATION_SRAM_CLIENT_ID}
    clientSecret = ""
    clientSecret = ${?JATOS_USER_AUTHENTICATION_SRAM_CLIENT_SECRET}
    scope = ["openid", "profile", "email", "voperson_external_id"]
    scope = ${?JATOS_USER_AUTHENTICATION_SRAM_SCOPE}
    pkceMode = "off"
    pkceMode = ${?JATOS_USER_AUTHENTICATION_SRAM_PKCE_MODE}
    usernameFrom = "eduperson_principal_name"
    usernameFrom = ${?JATOS_USER_AUTHENTICATION_SRAM_USERNAME_FROM}
    idTokenSigningAlgorithm = "RS256"
    idTokenSigningAlgorithm = ${?JATOS_USER_AUTHENTICATION_SRAM_ID_TOKEN_SIGNING_ALGORITHM}
    signInButtonText = "Sign in with SRAM"
    signInButtonText = ${?JATOS_USER_AUTHENTICATION_SRAM_SIGN_IN_BUTTON_TEXT}
    signInButtonLogoUrl = "assets/lib/jatos-gui/images/surf.svg"
    signInButtonLogoUrl = ${?JATOS_USER_AUTHENTICATION_SRAM_SIGN_IN_BUTTON_LOGO_URL}
    successFeedback = "You successfully connected your SRAM ID to JATOS."
    successFeedback = ${?JATOS_USER_AUTHENTICATION_SRAM_SUCCESS_FEEDBACK}
  }

  # SURFconext (surfconext.nl) authentication
  user.authentication.conext {
    discoveryUrl = "https://connect.surfconext.nl/.well-known/openid-configuration"
    discoveryUrl = ${?JATOS_USER_AUTHENTICATION_CONEXT_DISCOVERY_URL}
    clientId = ""
    clientId = ${?JATOS_USER_AUTHENTICATION_CONEXT_CLIENT_ID}
    clientSecret = ""
    clientSecret = ${?JATOS_USER_AUTHENTICATION_CONEXT_CLIENT_SECRET}
    scope = ["openid"]
    scope = ${?JATOS_USER_AUTHENTICATION_CONEXT_SCOPE}
    pkceMode = "off"
    pkceMode = ${?JATOS_USER_AUTHENTICATION_CONEXT_PKCE_MODE}
    usernameFrom = "eduperson_principal_name"
    usernameFrom = ${?JATOS_USER_AUTHENTICATION_CONEXT_USERNAME_FROM}
    idTokenSigningAlgorithm = "RS256"
    idTokenSigningAlgorithm = ${?JATOS_USER_AUTHENTICATION_CONEXT_ID_TOKEN_SIGNING_ALGORITHM}
    signInButtonText = "Sign in with SURFconext"
    signInButtonText = ${?JATOS_USER_AUTHENTICATION_CONEXT_SIGN_IN_BUTTON_TEXT}
    signInButtonLogoUrl = "assets/lib/jatos-gui/images/surf.svg"
    signInButtonLogoUrl = ${?JATOS_USER_AUTHENTICATION_CONEXT_SIGN_IN_BUTTON_LOGO_URL}
    successFeedback = "You successfully connected your SURFconext ID to JATOS."
    successFeedback = ${?JATOS_USER_AUTHENTICATION_CONEXT_SUCCESS_FEEDBACK}
  }

  # Allow giving the role SUPERUSER to a user. This role allows a user to access ANY study as if they were
  # a study member (incl accessing result data or deleting the study)
  user.role.allowSuperuser = false
  user.role.allowSuperuser = ${?JATOS_USER_ROLE_ALLOW_SUPERUSER}

  # Initial or forced admin password
  user.admin.password = null
  user.admin.password = ${?JATOS_ADMIN_PASSWORD}

  # A message sent by the loader script after an update attempt
  update.msg = null
  update.msg = ${?JATOS_UPDATE_MSG}

  # JATOS ID cookies
  idCookies {
    # If true the ID cookie's 'secure' attribute is set (similar play.server.session.secure)
    secure = false
    secure = ${?JATOS_ID_COOKIES_SECURE}

    # Defines the ID cookie's 'SameSite' attribute: 'None', 'Lax', or 'Strict'
    sameSite = ""
    sameSite = ${?JATOS_ID_COOKIES_SAME_SITE}

    # Max number of ID cookies
    limit = 10
    limit = ${?JATOS_ID_COOKIES_LIMIT}
  }

  # JATOS GUI - Show donations button in GUI
  donationAllowed = false
  donationAllowed = ${?JATOS_DONATION_ALLOWED}

  # JATOS GUI - URL link to the 'terms of use' that will be shown in a info box on the home page
  # If empty it's not shown
  termsOfUseUrl = ""
  termsOfUseUrl = ${?JATOS_TERMS_OF_USE_URL}

  # JATOS GUI - URL to some static HTML that will be shown on the home page instead of the default welcome message.
  # If empty the default welcome message is shown.
  brandingUrl = ""
  brandingUrl = ${?JATOS_BRANDING_URL}

  # JATOS GUI - Allow to add all users that exist on this JATOS server to be added at once as members of a study
  studyMembers.allowAddAllUsers = false
  studyMembers.allowAddAllUsers = ${?JATOS_STUDY_MEMBERS_ALLOW_ADD_ALL_USERS}

  # JATOS GUI - Show certain columns in the study admin page. Sometimes the file system or the database is too slow
  # to calculate all this.
  studyAdmin.showStudyAssetsSize = true
  studyAdmin.showStudyAssetsSize = ${?JATOS_STUDY_ADMIN_SHOW_STUDY_ASSETS_SIZE}
  studyAdmin.showResultDataSize = false
  studyAdmin.showResultDataSize = ${?JATOS_STUDY_ADMIN_SHOW_RESULT_DATA_SIZE}
  studyAdmin.showResultFileSize = false
  studyAdmin.showResultFileSize = ${?JATOS_STUDY_ADMIN_SHOW_RESULT_FILE_SIZE}

  # JATOS API
  api {
    # Is the JATOS API enabled.
    allowed = true
    allowed = ${?JATOS_API_ALLOWED}

    # Is it allowed to generate new tokens via the API
    tokens.apiGeneration.allowed = true
    tokens.apiGeneration.allowed = ${?JATOS_API_TOKENS_API_GENERATION_ALLOWED}

    # The duration for which a token generated via the API remains valid after its creation. This setting does not apply
    # to tokens created via the GUI.
    tokens.apiGeneration.expiresAfter = 3600s
    tokens.apiGeneration.expiresAfter = ${?JATOS_API_TOKENS_API_GENERATION_EXPIRES_AFTER}
  }

  # JATOS application log (not to be confused with the study log)
  logs {
    # Location in the file system. By default it's in JATOS' folder under 'logs'.
    path = ${play.server.dir}/logs
    path = ${?JATOS_LOGS_PATH}

    # Filename of the log files without suffix
    filename = "application"
    filename = ${?JATOS_LOGS_FILENAME}

    # Logback appender (one of ASYNCFILE, FILE, ASYNCSTDOUT, STDOUT)
    appender = "ASYNCFILE"
    appender = ${?JATOS_LOGS_APPENDER}

    level {
      root = INFO
      root = ${?JATOS_LOGS_LEVEL_ROOT}
      services = INFO
      services = ${?JATOS_LOGS_LEVEL_SERVICES}
      batch = INFO
      batch = ${?JATOS_LOGS_LEVEL_BATCH}
      group = INFO
      group = ${?JATOS_LOGS_LEVEL_GROUP}
    }

    # Request categories logged by RequestLoggingFilter.
    # Possible values are "api", "gui", "publix", "assets", and "all".
    requestCategories = ["gui", "publix", "api"]
    requestCategories = ${?JATOS_LOGS_REQUEST_CATEGORIES}
  }

  # Database configuration (default is H2)
  db {
    url = "jdbc:h2:./database/jatos;MODE=MYSQL;DATABASE_TO_UPPER=FALSE;IGNORECASE=TRUE;DEFAULT_LOCK_TIMEOUT=10000;NON_KEYWORDS=USER"
    url = ${?JATOS_DB_URL}
    driver = "org.h2.Driver"
    driver = ${?JATOS_DB_DRIVER}
    username = null
    username = ${?JATOS_DB_USERNAME}
    password = null
    password = ${?JATOS_DB_PASSWORD}
  }

  # Number of database connections
  db.connectionPool.size = 75
  db.connectionPool.size = ${?JATOS_DB_CONNECTIONPOOL_SIZE}

  # Number of threads responsible for blocking operations (all database and file I/O - except study assets I/O)
  threadPool.size = 100
  threadPool.size = ${?JATOS_THREADPOOL_SIZE}

  # Number of threads that handles file system I/O for study assets
  studyAssets.threadPool.size = 32
  studyAssets.threadPool.size = ${?JATOS_STUDYASSETS_THREADPOOL_SIZE}

  # Path to JATOS' tmp directory. E.g. used to temporarily store studies during import.
  tmpPath = null
  tmpPath = ${?JATOS_TMP_PATH}

  # True indicates that this JATOS runs in a cluster with other JATOS nodes.
  multiNode = false
  multiNode = ${?JATOS_MULTI_NODE}

  # Time to wait for another node to acknowledge a group message.
  groupMessageAckTimeout = 3 second
  groupMessageAckTimeout = ${?JATOS_GROUP_MESSAGE_ACK_TIMEOUT}

  # Sets the locale for use in the GUI, e.g. "en-GB". If not set the browser's locale (as set in 'navigator.language') is used.
  locale = ""
  locale = ${?JATOS_LOCALE}

  # File extension of JATOS study archive files
  studyArchive.suffix = "jzip"
  studyArchive.suffix = ${?JATOS_STUDY_ARCHIVE_SUFFIX}

  # File extension of JATOS results archive files
  resultsArchive.suffix = "zip"
  resultsArchive.suffix = ${?JATOS_RESULTS_ARCHIVE_SUFFIX}

  groups.cleaning {
    # Is group cleaning allowed (removal of inactive group members)
    allowed = true
    allowed = ${?JATOS_GROUPS_CLEANING_ALLOWED}

    # Interval in seconds the group cleaner is started
    interval = 60
    interval = ${?JATOS_GROUPS_CLEANING_INTERVAL}

    # After how many seconds a group member is regarded as idle
    memberIdleAfter = 90
    memberIdleAfter = ${?JATOS_GROUPS_CLEANING_MEMBER_IDLE_AFTER}
  }

  # The 'lastSeenDate' row will be updated only if it is older then this time span
  # This is supposed to reduce database writes.
  studyResult.lastSeenDate.updateThreshold = 30s
  studyResult.lastSeenDate.updateThreshold = ${?JATOS_STUDY_RESULT_LAST_SEEN_DATE_UPDATE_THRESHOLD}

  openai {
      # Are study runs allowed to call the OpenAI API?
      allowed = false
      allowed = ${?JATOS_OPENAI_ALLOWED}
      # OpenAI API key
      apiKey = ""
      apiKey = ${?JATOS_OPENAI_API_KEY}
      # The base URL path to be used to call the OpenAI API
      urlBasePath = "/v1/"
      urlBasePath = ${?JATOS_OPENAI_URL_BASE_PATH}
      # Maximum number of OpenAI API calls per single study run
      callLimit = 10
      callLimit = ${?JATOS_OPENAI_CALL_LIMIT}
      # Timeout waiting for an OpenAI response
      timeout = 180
      timeout = ${?JATOS_OPENAI_TIMEOUT}
    }

    # Embedded MCP server.
    mcp {
      enabled = true
      enabled = ${?JATOS_MCP_ENABLED}
      apiTimeout = 10s
      apiTimeout = ${?JATOS_MCP_API_TIMEOUT}
      maxResponseSize = 5MiB
      maxResponseSize = ${?JATOS_MCP_MAX_RESPONSE_SIZE}
      # Includes Base64 archive text for study imports. Raise explicitly for larger archives.
      maxRequestSize = 11MiB
      maxRequestSize = ${?JATOS_MCP_MAX_REQUEST_SIZE}
      # Exact browser origins; native MCP clients normally send no Origin header.
      allowedOrigins = []
      allowedOrigins = ${?JATOS_MCP_ALLOWED_ORIGINS}
    }
}


# HTTP server config
# ~~~~~
play.server {
  http.address = ${jatos.http.address}
  http.port = ${jatos.http.port}

  # The time after which an idle connection will be automatically closed.
  # Set to `infinite` to completely disable idle connection timeouts.
  http.idleTimeout = infinite

  pekko {
    # How long a request takes until it times out. Set to null or "infinite" to disable the timeout.
    requestTimeout = infinite
    # Max HTTP URI length
    max-uri-length = 16k
    # Max HTTP header length (increase if requests return with "HTTP header value exceeds the configured limit of x characters")
    max-header-size = 32k
  }
}

play.http {
  context = ${jatos.urlBasePath}

  errorHandler = "general.ErrorHandler"

  # File upload
  parser.maxDiskBuffer = ${jatos.http.parser.maxDiskBuffer}

  # JSON, text and form request limit; raw uploads spill to disk above this threshold.
  # Result submissions use jatos.resultData.maxSize instead.
  parser.maxMemoryBuffer = ${jatos.http.parser.maxMemoryBuffer}

  # Secure session cookie (set true to restrict user access to HTTPS)
  session.secure = false
}


# Make all properties here available in logback
# ~~~~~
play.logger.includeConfigProperties = true


# Play module configuration
# ~~~~~
play.modules {

  # JATOS has its own Jackson JSON ObjectMapper
  disabled += "play.core.ObjectMapperModule"

  # Disable Play's default JPA module to allow JATOS custom JPAApi provider
  disabled += "play.db.jpa.JPAModule"

  # Guice config (dependency injection)
  enabled += "general.GuiceModule"
  enabled += "general.common.CommonGuiceModule"
  enabled += "general.session.SessionGuiceModule"
  enabled += "general.gui.GuiGuiceModule"
}

# Database configuration
# ~~~~~
db {
  default.url = ${jatos.db.url}
  default.driver = ${jatos.db.driver}
  default.jndiName = "DefaultDS"
  default.username = ${jatos.db.username}
  default.password = ${jatos.db.password}
}
# JATOS uses Hibernate ORM
jpa {
  default = "relationalPersistenceUnit"
}
# Set Hikari database connection pool to fixed size
play.db {
  prototype {
    hikaricp.minimumIdle = ${jatos.db.connectionPool.size}
    hikaricp.maximumPoolSize = ${jatos.db.connectionPool.size}
  }
}
# JATOS uses Play's Evolutions for auto DB evolution
play.evolutions {
  enabled = true
  autoApply = true
  useLocks = ${jatos.multiNode}
}


# JATOS' thread pools
# ~~~~~
# Custom fixed thread pool for blocking database and I/O operations except study assets I/O
threadpool.io.dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = ${jatos.threadPool.size}
  }
  throughput = 1
}

# Custom fixed thread pool for blocking file I/O operations (reading/writing files)
threadpool.studyAssets.dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = ${?jatos.studyAssets.threadPool.size}
  }
  throughput = 1
}


# Play's application secret
# The loader.sh/.bat generate a secret the first time JATOS starts. So usually there is no need to set it manually.
# ~~~~~
play.http.secret.key = ${?jatos.secret}

# Play's action creator
# ~~~~~
play.http.actionCreator = "actions.common.ContextActionCreator"
play.http.actionComposition.executeActionCreatorActionFirst = true


# Pekko configuration
# ~~~~~
pekko {
  log-dead-letters = 0
  log-dead-letters-during-shutdown = off

  actor {
    # Multi-node installations override this with "cluster".
    provider = local

    serialization-bindings {
      "cluster.ClusterSerializable" = jackson-cbor
    }
  }
}


# Filter configuration
# https://github.com/techmonad/play-cors-example/blob/master/conf/application.conf
# ~~~~~
play.filters {
  # Order is important!
  enabled += filters.ContextFilter # Has to be before any Filter that accesses the Context
  enabled += play.filters.csp.CSPFilter
  enabled += filters.RequestLoggingFilter
  enabled += filters.publix.IdCookieFilter
  enabled += filters.SelectiveGzipFilter
  enabled += play.filters.cors.CORSFilter
  enabled += play.filters.csrf.CSRFFilter
  enabled += filters.NoCacheHtmlFilter

  gzip {
    # Compress text assets and data, but not ZIP/JZIP exports or binary media.
    contentType.whiteList = ["text/html", "text/css", "text/javascript", "application/javascript",
      "application/json", "application/x-ndjson", "text/plain", "text/csv", "image/svg+xml"]
    threshold = 1k
  }

  csp.directives {
    base-uri = "'self'"
  }

  # Bypass requests with 'Authorization' headers used by API in CSRF filter
  csrf.header.bypassHeaders {
    Authorization = "*"
  }

  csp.nonce {
    # Use nonce value (generated and passed in through request attribute)
    enabled = true

    # Pattern to use to replace with nonce
    pattern = "%CSP_NONCE_PATTERN%"

    # Add the nonce to "X-Content-Security-Policy-Nonce" header.  This is useful for debugging.
    header = false
  }

  cors {
    exposedHeaders = ["Content-Disposition"]
  }

  hosts {
    allowed = ["localhost", "."]
  }

  # Security headers filter configuration
  headers {
    # The X-Frame-Options header
    frameOptions = "SAMEORIGIN"

    # Default is 'nosniff' - but we have to allow content-type sniffing for the study assets
    contentTypeOptions = null
  }
}


